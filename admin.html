<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安國小書箱後台管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #F4F9F2; font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <!-- ================= 登入介面 ================= -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-sm w-full border-t-4 border-green-600">
            <h1 class="text-2xl font-bold text-center text-green-800 mb-6">書箱資源庫 - 後台登入</h1>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">管理員信箱</label>
                    <input type="email" id="loginEmail" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">密碼</label>
                    <input type="password" id="loginPassword" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <p id="loginError" class="text-red-500 text-sm hidden"></p>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700">
                    登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- ================= 管理介面 ================= -->
    <div id="adminSection" class="hidden min-h-screen flex flex-col">
        
        <!-- 頂部導覽列 -->
        <header class="bg-green-700 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 長安國小書箱後台管理</h1>
            <div class="space-x-4">
                <span id="userEmailDisplay" class="text-sm text-green-200"></span>
                <button id="btnOpenPwdModal" class="text-sm bg-green-600 hover:bg-green-500 px-3 py-1 rounded">修改我的密碼</button>
                <a href="https://console.firebase.google.com/" target="_blank" class="text-sm bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded inline-block">管理員帳號設定 (控制台)</a>
                <button id="btnLogout" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-1 rounded">登出</button>
            </div>
        </header>

        <main class="flex-grow p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 左側：功能操作區 -->
            <div class="lg:col-span-1 space-y-6">
                <!-- 匯入 Excel 區塊 -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                    <h2 class="text-lg font-bold mb-4 text-blue-700">1. 批次匯入 (Excel)</h2>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4"/>
                    <button id="btnImport" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">開始匯入至 Firebase</button>
                    <p id="importStatus" class="mt-2 text-sm font-bold text-gray-600"></p>
                </div>

                <!-- 單筆新增/修改表單 -->
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-amber-500">
                    <h2 id="formTitle" class="text-lg font-bold mb-4 text-amber-700">2. 單筆新增書箱</h2>
                    <form id="bookForm" class="space-y-3">
                        <div>
                            <label class="block text-sm font-bold text-gray-700">登錄號 (ID) <span class="text-red-500">*必填不能重複</span></label>
                            <input type="text" id="bookId" required class="w-full px-3 py-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700">書箱名稱 <span class="text-red-500">*必填</span></label>
                            <input type="text" id="bookName" required class="w-full px-3 py-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700">書箱描述 (網址)</label>
                            <input type="url" id="bookDesc" class="w-full px-3 py-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700">說明</label>
                            <textarea id="bookNote" rows="3" class="w-full px-3 py-2 border rounded"></textarea>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded">儲存資料</button>
                            <button type="button" id="btnCancelEdit" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">取消修改</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 右側：資料列表區 (加入批次刪除) -->
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">現有書箱列表 (<span id="totalBooks">0</span>)</h2>
                    <div class="space-x-2">
                        <button id="btnBatchDelete" class="bg-red-100 hover:bg-red-200 text-red-700 font-bold px-4 py-2 rounded text-sm transition-colors">
                            🗑️ 批次刪除勾選項
                        </button>
                        <button id="btnRefresh" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-2 rounded text-sm">
                            重新整理
                        </button>
                    </div>
                </div>
                
                <div class="overflow-y-auto flex-grow border rounded h-[600px]">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-100 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-4 py-3 text-center w-12">
                                    <input type="checkbox" id="selectAll" class="w-4 h-4 text-green-600 rounded border-gray-300">
                                </th>
                                <th class="px-4 py-3 text-left text-sm font-bold text-gray-700 uppercase">登錄號</th>
                                <th class="px-4 py-3 text-left text-sm font-bold text-gray-700 uppercase">書名</th>
                                <th class="px-4 py-3 text-right text-sm font-bold text-gray-700 uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody id="booksTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- JS動態產生 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 修改密碼 Modal -->
    <div id="pwdModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96">
            <h2 class="text-xl font-bold mb-4">修改密碼</h2>
            <form id="pwdForm" class="space-y-4">
                <div>
                    <label class="block text-sm">新密碼 (至少6碼)</label>
                    <input type="password" id="newPwd" required minlength="6" class="w-full px-3 py-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm">確認新密碼</label>
                    <input type="password" id="newPwdConfirm" required minlength="6" class="w-full px-3 py-2 border rounded">
                </div>
                <p id="pwdError" class="text-red-500 text-sm hidden"></p>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" id="btnCancelPwd" class="px-4 py-2 bg-gray-300 rounded">取消</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">確認修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // !!! 請貼上您的 Firebase Config !!!
        // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyDrog2SU3iOuaNXnMT6A5Ekrdmd-5jG6A0",
  authDomain: "bookbox-ee296.firebaseapp.com",
  projectId: "bookbox-ee296",
  storageBucket: "bookbox-ee296.firebasestorage.app",
  messagingSenderId: "1094028983994",
  appId: "1:1094028983994:web:cd0dfcea689b93fdcb0c83"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- UI 切換邏輯 ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('userEmailDisplay').textContent = user.email;
                loadBooks();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('adminSection').classList.add('hidden');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
            } catch (error) {
                document.getElementById('loginError').textContent = "登入失敗：帳號或密碼錯誤！";
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        // --- 密碼修改邏輯 ---
        const pwdModal = document.getElementById('pwdModal');
        document.getElementById('btnOpenPwdModal').addEventListener('click', () => pwdModal.classList.remove('hidden'));
        document.getElementById('btnCancelPwd').addEventListener('click', () => pwdModal.classList.add('hidden'));
        
        document.getElementById('pwdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPwd').value;
            const p2 = document.getElementById('newPwdConfirm').value;
            const err = document.getElementById('pwdError');
            if(p1 !== p2) {
                err.textContent = "兩次密碼不一致！"; err.classList.remove('hidden'); return;
            }
            try {
                await updatePassword(auth.currentUser, p1);
                alert('密碼修改成功！');
                pwdModal.classList.add('hidden');
                document.getElementById('pwdForm').reset();
            } catch (error) {
                err.textContent = "修改失敗。請登出重新登入後再試。"; err.classList.remove('hidden');
            }
        });

        // --- 讀取並顯示書單列表 (加入 Checkbox) ---
        async function loadBooks() {
            const tbody = document.getElementById('booksTableBody');
            document.getElementById('selectAll').checked = false; // 重置全選框
            tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">載入中...</td></tr>';
            try {
                const querySnapshot = await getDocs(collection(db, "books"));
                const books = [];
                querySnapshot.forEach(doc => books.push(doc.data()));
                books.sort((a, b) => a.id.localeCompare(b.id));
                
                document.getElementById('totalBooks').textContent = books.length;
                tbody.innerHTML = '';
                
                books.forEach(book => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-4 py-3 text-center">
                            <input type="checkbox" value="${book.id}" class="book-cb w-4 h-4 text-green-600 rounded border-gray-300 cursor-pointer">
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-base font-bold text-gray-900">${book.id}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-base text-gray-600">${book.name}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-right text-base font-medium">
                            <button class="text-indigo-600 hover:text-indigo-900 mr-4 font-bold edit-btn" data-id="${book.id}">修改</button>
                            <button class="text-red-600 hover:text-red-900 font-bold delete-btn" data-id="${book.id}">刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => editBook(e.target.dataset.id, books)));
                document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => deleteBook(e.target.dataset.id)));
                
                // 處理單一勾選時，同步全選框狀態
                const cbs = document.querySelectorAll('.book-cb');
                cbs.forEach(cb => {
                    cb.addEventListener('change', () => {
                        const allChecked = document.querySelectorAll('.book-cb:checked').length === cbs.length;
                        document.getElementById('selectAll').checked = allChecked;
                    });
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-red-500">讀取失敗</td></tr>';
            }
        }
        document.getElementById('btnRefresh').addEventListener('click', loadBooks);

        // --- 全選功能 ---
        document.getElementById('selectAll').addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            document.querySelectorAll('.book-cb').forEach(cb => cb.checked = isChecked);
        });

        // --- 批次刪除功能 ---
        document.getElementById('btnBatchDelete').addEventListener('click', async () => {
            const selectedIds = Array.from(document.querySelectorAll('.book-cb:checked')).map(cb => cb.value);
            
            if (selectedIds.length === 0) {
                alert('請先在左側勾選要刪除的書箱！');
                return;
            }
            
            if (confirm(`⚠️ 警告！您確定要刪除選取的 ${selectedIds.length} 筆書箱資料嗎？\n(刪除後無法復原)`)) {
                try {
                    // 使用 Promise.all 批次執行刪除
                    await Promise.all(selectedIds.map(id => deleteDoc(doc(db, "books", id))));
                    alert(`✅ 成功刪除 ${selectedIds.length} 筆資料！`);
                    loadBooks();
                } catch (error) {
                    alert('批次刪除過程中發生錯誤，請重新整理後再試。');
                }
            }
        });

        // --- 單筆新增 / 修改 / 刪除 ---
        let isEditing = false;
        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookData = {
                id: document.getElementById('bookId').value.trim(),
                name: document.getElementById('bookName').value.trim(),
                descLink: document.getElementById('bookDesc').value.trim(),
                note: document.getElementById('bookNote').value.trim()
            };
            try {
                await setDoc(doc(db, "books", bookData.id), bookData);
                alert(isEditing ? '修改成功！' : '新增成功！');
                resetForm(); loadBooks();
            } catch (error) { alert("儲存失敗"); }
        });

        function editBook(id, books) {
            const book = books.find(b => b.id === id);
            if(book) {
                document.getElementById('bookId').value = book.id;
                document.getElementById('bookId').readOnly = true; 
                document.getElementById('bookId').classList.add('bg-gray-100');
                document.getElementById('bookName').value = book.name;
                document.getElementById('bookDesc').value = book.descLink;
                document.getElementById('bookNote').value = book.note;
                
                document.getElementById('formTitle').textContent = "修改書箱: " + book.id;
                document.getElementById('btnCancelEdit').classList.remove('hidden');
                isEditing = true;
                window.scrollTo(0, 0);
            }
        }

        function resetForm() {
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').readOnly = false;
            document.getElementById('bookId').classList.remove('bg-gray-100');
            document.getElementById('formTitle').textContent = "2. 單筆新增書箱";
            document.getElementById('btnCancelEdit').classList.add('hidden');
            isEditing = false;
        }
        document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

        async function deleteBook(id) {
            if(confirm(`確定要刪除登錄號為 ${id} 的書箱嗎？`)) {
                try { await deleteDoc(doc(db, "books", id)); loadBooks(); } 
                catch(e) { alert('刪除失敗'); }
            }
        }

        // --- 批次匯入 Excel ---
        document.getElementById('btnImport').addEventListener('click', () => {
            const fileInput = document.getElementById('excelFile');
            if (fileInput.files.length === 0) return alert("請先選擇 Excel 檔案！");
            
            const status = document.getElementById('importStatus');
            status.textContent = "解析中，請勿關閉網頁...";
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, {defval: ""}); 
                    
                    let count = 0;
                    for(let row of json) {
                        const id = row['書箱登錄號'];
                        if(!id) continue;
                        const bookData = {
                            id: id.toString().trim(),
                            name: row['書箱名稱'].toString().trim(),
                            descLink: row['書箱描述'].toString().trim(),
                            note: row['說明'].toString().trim()
                        };
                        await setDoc(doc(db, "books", bookData.id), bookData);
                        count++;
                        status.textContent = `匯入中: 已完成 ${count} 筆...`;
                    }
                    status.textContent = `匯入完成！共新增/更新了 ${count} 筆資料。`;
                    fileInput.value = "";
                    loadBooks(); 
                } catch (error) {
                    status.textContent = "匯入失敗，請檢查檔案格式。";
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        });
    </script>
</body>
</html>
